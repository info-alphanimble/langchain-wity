[project]
name = "langchain-wity"
version = "0.1.0"
description = "LangChain integration for Wity, the typed-decision API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["wity", "langchain", "typed-decisions", "classification", "middleware", "agents"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "wity-sdk>=0.1.1,<0.2",
    "langchain-core>=1.6.2,<2",
    "langchain>=1.3.15,<2",
    "httpx>=0.27,<1",
    "langsmith>=0.3.45,<1",
    "pydantic>=2.7.4,<3",
    "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://wity.alphanimble.com"
Documentation = "https://wity.alphanimble.com/docs/api"
Repository = "https://github.com/info-alphanimble/langchain-wity"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_wity"]

[tool.ruff]
line-length = 120
target-version = "py310"
# README examples keep hand-aligned comments.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No network in tests. Live tests turn it back on for themselves.
addopts = "--disable-socket --allow-unix-socket"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3",
    "pytest-socket>=0.7",
    "ruff>=0.16.9",
]
